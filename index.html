<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/index.css">
</head>

<body>

    <nav class="navbar barra-superior fixed-top">
        <div class="container-fluid">

            <div>
                <button class="btn btn-hamburguesa" onclick="abrirCerrarMenu()">☰</button>
                <img src="img/logo.png" alt="Logo" class="logo">
                <span class="text-white">Sistema Escolar</span>
            </div>

            <div class="dropdown">
                <a class="dropdown-toggle text-white" href="#" id="nombreUsuario" data-bs-toggle="dropdown">Usuario</a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#" onclick="salir()">Salir</a></li>
                </ul>
            </div>

        </div>
    </nav>

    <div id="sidebar" class="sidebar">
        <a class="nav-link" data-bs-toggle="collapse" href="#submenuUsuarios">Usuarios ▾</a>

        <div class="collapse submenu" id="submenuUsuarios">
            <a href="#" class="nav-link" onclick="mostrarSeccion('captura')">Captura</a>
            <a href="#" class="nav-link" onclick="mostrarSeccion('alumnos')">Alumnos</a>
        </div>
    </div>

    <div id="contenido" class="contenido">

        <div id="seccion-inicio">
            <h2 class="titulo">Bienvenido al sistema</h2>
            <p>Abre el menú Usuarios para capturar usuarios o alumnos.</p>
        </div>

        <div id="seccion-captura" class="d-none">
            <h2 class="titulo">Captura de usuario</h2>

            <form id="formUsuario" class="tarjeta" onsubmit="guardarUsuario(event)">
                <div class="mb-3">
                    <label>Nombre de usuario</label>
                    <input type="text" id="nombreCaptura" class="form-control">
                    <small class="text-danger" id="errorNombreCaptura"></small>
                </div>

                <div class="mb-3">
                    <label>Correo electrónico</label>
                    <input type="text" id="correoCaptura" class="form-control">
                    <small class="text-danger" id="errorCorreoCaptura"></small>
                </div>

                <div class="mb-3">
                    <label>Contraseña</label>
                    <input type="password" id="passwordCaptura" class="form-control">
                    <small class="text-danger" id="errorPasswordCaptura"></small>
                </div>

                <button type="submit" class="btn btn-guinda">Guardar usuario</button>
                <p id="mensajeUsuario" class="text-success mt-3"></p>
            </form>
        </div>

        <div id="seccion-alumnos" class="d-none">
            <h2 class="titulo">Captura de alumno</h2>

            <form id="formAlumno" class="tarjeta" onsubmit="guardarAlumno(event)">
                <div class="mb-3">
                    <label>Nombre del alumno</label>
                    <input type="text" id="nombreAlumno" class="form-control">
                    <small class="text-danger" id="errorNombreAlumno"></small>
                </div>

                <div class="mb-3">
                    <label>Número de control</label>
                    <input type="text" id="numeroControl" class="form-control" placeholder="6 dígitos">
                    <small class="text-danger" id="errorNumeroControl"></small>
                </div>

                <div class="mb-3">
                    <label>Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" class="form-control">
                    <small class="text-danger" id="errorFecha"></small>
                </div>

                <button type="submit" class="btn btn-guinda">Verificar edad</button>
            </form>
        </div>

    </div>

    <div class="modal fade" id="modalEdad" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Resultado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalEdadTexto"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-guinda" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/utileria.js"></script>
    <script src="JS/index.js"></script>

</body>

</html>
